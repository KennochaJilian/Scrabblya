<VirtualHost *:80>
    ServerName scrabblya.aquarius.irish

    RedirectMatch 302 "^/telecharger$" "/telecharger/"
    Alias /telecharger/apk/ /var/www/scrabblya/apks/
    Alias /telecharger/ /var/www/scrabblya/current/
    <Directory /var/www/scrabblya/>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        Header set Cache-Control "no-cache"
        Header set X-Content-Type-Options "nosniff"
        Header set Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
        AddType application/vnd.android.package-archive .apk
        AddType text/plain .sha256
        <FilesMatch "\.apk$">
            Header set Content-Disposition "attachment"
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    # Discard client-supplied forwarding headers before Apache appends the real IP.
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    LimitRequestBody 3145728

    ProxyPass /api/ http://127.0.0.1:3001/api/ connectiontimeout=5 timeout=35
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/
    ProxyPass /health http://127.0.0.1:3001/health connectiontimeout=5 timeout=10
    ProxyPassReverse /health http://127.0.0.1:3001/health

    ErrorLog ${APACHE_LOG_DIR}/scrabblya_error.log
    CustomLog ${APACHE_LOG_DIR}/scrabblya_access.log combined
</VirtualHost>
