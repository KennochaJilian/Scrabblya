// Loaded only by the release CI preparation script. Passwords stay in the environment.
def required = ['ANDROID_KEYSTORE_FILE', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
required.each { name ->
    if (!System.getenv(name)) throw new GradleException("Missing Android signing variable: " + name)
}
def releaseKeystore = new File(System.getenv('ANDROID_KEYSTORE_FILE'))
if (!releaseKeystore.isFile()) throw new GradleException('Android release keystore is inaccessible.')
android {
    signingConfigs {
        scrabblyaRelease {
            storeFile releaseKeystore
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.scrabblyaRelease
            debuggable false
        }
    }
}
